# Production stack: database, backend, and Caddy with the Mini App.
# Run from this directory with a .env next to it (see .env.example):
#   docker compose up -d --build
name: scheduler

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scheduler
    # No published ports: only the backend reaches it.
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      HTTP_ADDR: 0.0.0.0:8081
      DATABASE_URL: postgres://scheduler:${POSTGRES_PASSWORD}@db:5432/scheduler?sslmode=disable
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      BOT_ENABLED: ${BOT_ENABLED:-true}
      WEBAPP_URL: https://${DOMAIN:?set DOMAIN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      # 80 and 443 are what Let's Encrypt and Telegram need; they can be moved for a trial run.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
