openapi: 3.0.3
info:
  title: Scheduler API
  version: 0.1.0
  description: Task planner API. Source of truth for the Go server and the TS client.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: me
  - name: categories
  - name: tasks
  - name: tracking
  - name: stats
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database readiness probe
      tags: [system]
      security: []
      responses:
        "200":
          description: Service is up and the database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/telegram:
    post:
      operationId: loginTelegram
      summary: Sign in with Telegram Mini App init data
      description: |
        Verifies the signature and freshness of `init_data`. The account is
        created on the first sign-in; `timezone` is used only then.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionIssued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/dev:
    post:
      operationId: loginDev
      summary: Sign in without Telegram (development only)
      description: |
        Available only when the server runs with `APP_ENV=dev` and
        `DEV_AUTH=true`; otherwise responds 404. Each `key` is a separate user.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionIssued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /me:
    get:
      operationId: getMe
      summary: Current user with settings
      tags: [me]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/settings:
    patch:
      operationId: updateMySettings
      summary: Change settings; omitted fields stay as they are
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories:
    get:
      operationId: listCategories
      summary: All categories of the user, archived ones included
      description: A flat list; build the tree from `parent_id`.
      tags: [categories]
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      summary: Create a category
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    patch:
      operationId: updateCategory
      summary: Rename or recolor a category; omitted fields stay as they are
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCategory
      summary: Delete a category together with all its subcategories
      description: |
        The deleted categories are removed from all tasks. Tasks themselves are kept.
      tags: [categories]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories/{id}/move:
    post:
      operationId: moveCategory
      summary: Move a category to another parent or to the top level
      description: |
        Error codes: `category_cycle` (the new parent is the category itself or
        one of its descendants), `parent_archived`.
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveCategoryRequest"
      responses:
        "200":
          description: Moved category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories/{id}/archive:
    post:
      operationId: archiveCategory
      summary: Archive a category together with all its subcategories
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Archived category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories/{id}/unarchive:
    post:
      operationId: unarchiveCategory
      summary: Restore one archived category
      description: |
        Its subcategories stay archived. Fails with `parent_archived` while
        the parent is archived.
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Restored category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances:
    get:
      operationId: listInstances
      summary: Tasks planned within a time window
      description: |
        Returns the tasks whose plan overlaps `[from, to)`, ordered by start.
        A task that crosses the window edge is returned whole. The window is at
        most 100 days.
      tags: [tasks]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tasks:
    post:
      operationId: createTask
      summary: Create a one-off task
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /instances/{id}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    patch:
      operationId: updateInstance
      summary: Edit a task; omitted fields stay as they are
      description: |
        With `scope=this` (the default) the task is changed on its own and answers with it;
        an occurrence of a regular task then becomes independent of later edits of the series.

        With `scope=following` or `all` the series is rewritten and the answer is 204:
        occurrences that are still planned and untouched are re-created from the new
        template when their window is next requested, so their ids change. Marked
        occurrences (with a fact or a status other than planned) are never changed.
        Only the time of day and the duration can change this way; a new date is
        refused with code `series_date_change`. `recurrence` changes the repeat rule.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/Scope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceRequest"
      responses:
        "200":
          description: Updated task (`scope=this`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "204":
          description: The series was rewritten (`scope=following` or `all`)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteInstance
      summary: Delete a task
      description: |
        Deleting one occurrence of a regular task keeps it as cancelled, so it is not
        created again. `following` and `all` delete the planned occurrences of the
        series; marked ones are history and stay as one-off tasks.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/Scope"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/running:
    get:
      operationId: listRunningInstances
      summary: Tasks whose timer is running, from whatever day they were started
      tags: [tracking]
      responses:
        "200":
          description: Running tasks, the longest running first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stats:
    get:
      operationId: getStats
      summary: Statistics of a period, by the fact
      description: |
        Hours by category and by task, the busy time, plan against fact, the breakdown by
        day and the deviations (FR-8). The period is at most 366 days; days are local days
        of the user's time zone.

        A running timer counts up to now, but at most 12 hours: a timer that runs longer
        counts only its first 12 hours and is reported in `long_running_timers`.
      tags: [stats]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /instances/unplanned:
    post:
      operationId: createUnplanned
      summary: Add a task outside the plan
      description: |
        With `actual_start` (and `actual_end`) the task is back-dated and done at once; with
        no `actual_end` a timer is running from `actual_start` (default: now).
      tags: [tracking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnplannedRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      operationId: completeInstance
      summary: "Done in one tap: the fact becomes equal to the plan"
      description: |
        Error code `invalid_state`: the task has no plan, or was rescheduled.
      tags: [tracking]
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{id}/start:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      operationId: startInstance
      summary: "Start a timer: the fact begins now"
      description: |
        Several tasks may run at once. Only a planned or not done task can be started (`invalid_state` otherwise).
      tags: [tracking]
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      operationId: stopInstance
      summary: "Stop the timer: the fact ends now and the task is done"
      description: |
        `invalid_state` when the task is not running.
      tags: [tracking]
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{id}/tracking:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    patch:
      operationId: updateTracking
      summary: Edit the status, the fact and the comment by hand
      description: |
        Omitted fields stay as they are. A status of `planned` removes the mark (the fact is
        cleared, the comment stays); `not_done` clears the fact too. With no status, a given
        fact decides it: a start alone is `in_progress`, a start and an end is `done`
        (a `partial` task stays partial). `done` or `partial` with no times take the plan.
        Rescheduled tasks cannot be changed (`invalid_state`).
      tags: [tracking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingPatch"
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{id}/reschedule:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      operationId: rescheduleInstance
      summary: Move a task to another time, leaving a trail
      description: |
        The original gets the status `rescheduled` and the reason and stays in the calendar;
        a new one-off task with the same title, description and categories is created at the
        new time and linked to it. Answers with the new task. Only a planned or not done task
        can be rescheduled (`invalid_state`).
      tags: [tracking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleRequest"
      responses:
        "201":
          description: The new task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /series/{id}:
    parameters:
      - $ref: "#/components/parameters/SeriesId"
    get:
      operationId: getSeries
      summary: The template of a regular task
      tags: [tasks]
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    SeriesId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      required: false
      description: |
        What an edit or a delete of an occurrence of a regular task applies to:
        only this one, this and the following ones, or all of them. A one-off
        task accepts only `this`.
      schema:
        type: string
        enum: [this, following, all]
        default: this
    InstanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from `/auth/telegram`.
  responses:
    SessionIssued:
      description: Session token and the signed-in user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: validation_failed
        message:
          type: string
        field:
          type: string
          description: Name of the invalid request field, if any
    TelegramLoginRequest:
      type: object
      required: [init_data, timezone]
      properties:
        init_data:
          type: string
          description: Raw `Telegram.WebApp.initData`
        timezone:
          type: string
          description: IANA time zone of the device
          example: Europe/Moscow
    DevLoginRequest:
      type: object
      required: [timezone]
      properties:
        key:
          type: string
          maxLength: 64
          description: Identifies the dev user; defaults to `dev`
        display_name:
          type: string
        timezone:
          type: string
          example: Europe/Moscow
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: "Bearer token; send it as `Authorization: Bearer <token>`"
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    ViewMode:
      type: string
      enum: [day, three_days, week]
    SlotMinutes:
      type: integer
      enum: [5, 10, 15, 30, 60]
      x-enum-varnames: [Slot5, Slot10, Slot15, Slot30, Slot60]
    User:
      type: object
      required: [id, display_name, timezone, slot_minutes, default_view, deviation_threshold_minutes]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        timezone:
          type: string
          description: IANA time zone
        slot_minutes:
          $ref: "#/components/schemas/SlotMinutes"
        default_view:
          $ref: "#/components/schemas/ViewMode"
        deviation_threshold_minutes:
          type: integer
          minimum: 0
          maximum: 1440
    SettingsPatch:
      type: object
      properties:
        timezone:
          type: string
        slot_minutes:
          $ref: "#/components/schemas/SlotMinutes"
        default_view:
          $ref: "#/components/schemas/ViewMode"
        deviation_threshold_minutes:
          type: integer
          minimum: 0
          maximum: 1440
    Category:
      type: object
      required: [id, parent_id, name, color, archived_at]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Null for top-level categories
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          example: "#3b82f6"
        archived_at:
          type: string
          format: date-time
          nullable: true
    CreateCategoryRequest:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          description: Hex color `#rrggbb`
          example: "#3b82f6"
        parent_id:
          type: string
          format: uuid
          description: Omit for a top-level category
    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          description: Hex color `#rrggbb`
    MoveCategoryRequest:
      type: object
      properties:
        parent_id:
          type: string
          format: uuid
          description: New parent; omit to move the category to the top level
    InstanceStatus:
      type: string
      enum: [planned, in_progress, done, partial, not_done, rescheduled, cancelled]
    DeviationKind:
      type: string
      enum: [started_late, started_early, finished_late, finished_early, took_longer, took_shorter]
    Deviation:
      type: object
      required: [kind, minutes]
      description: A difference between plan and fact that reaches the user's threshold.
      properties:
        kind:
          $ref: "#/components/schemas/DeviationKind"
        minutes:
          type: integer
          minimum: 1
    InstanceLink:
      type: object
      required: [id, planned_start, planned_end]
      description: The other half of a reschedule.
      properties:
        id:
          type: string
          format: uuid
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
    Instance:
      type: object
      required:
        - id
        - title
        - description
        - planned_start
        - planned_end
        - actual_start
        - actual_end
        - status
        - comment
        - category_ids
        - series_id
        - rescheduled_from
        - rescheduled_to
        - deviations
      properties:
        id:
          type: string
          format: uuid
        series_id:
          type: string
          format: uuid
          nullable: true
          description: Set for occurrences of a regular task; see `GET /series/{id}`
        title:
          type: string
        description:
          type: string
        planned_start:
          type: string
          format: date-time
          nullable: true
          description: Null for a task outside the plan
        planned_end:
          type: string
          format: date-time
          nullable: true
        actual_start:
          type: string
          format: date-time
          nullable: true
          description: Null until the task is started or marked
        actual_end:
          type: string
          format: date-time
          nullable: true
          description: Null while a timer is running
        status:
          $ref: "#/components/schemas/InstanceStatus"
        comment:
          type: string
        category_ids:
          type: array
          items:
            type: string
            format: uuid
        rescheduled_from:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InstanceLink"
        rescheduled_to:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InstanceLink"
        deviations:
          type: array
          description: Computed from the plan, the fact and the user's threshold; never stored
          items:
            $ref: "#/components/schemas/Deviation"
    TrackingPatch:
      type: object
      properties:
        status:
          type: string
          enum: [planned, in_progress, done, partial, not_done]
        actual_start:
          type: string
          format: date-time
        actual_end:
          type: string
          format: date-time
        comment:
          type: string
          maxLength: 2000
    RescheduleRequest:
      type: object
      required: [planned_start, planned_end]
      properties:
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
        comment:
          type: string
          maxLength: 2000
          description: The reason, shown on the original
    UnplannedRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        category_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        actual_start:
          type: string
          format: date-time
          description: Defaults to now
        actual_end:
          type: string
          format: date-time
          description: Omit to start a timer
    CreateTaskRequest:
      type: object
      required: [title, planned_start, planned_end]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
          description: Must be after `planned_start`; may be on a later day
        category_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        recurrence:
          $ref: "#/components/schemas/Recurrence"
    UpdateInstanceRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          description: An empty string clears the description
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
        category_ids:
          type: array
          maxItems: 50
          description: Replaces the whole set; an empty array removes all categories
          items:
            type: string
            format: uuid
        recurrence:
          $ref: "#/components/schemas/Recurrence"
    Recurrence:
      type: object
      required: [rrule]
      description: |
        Repeat rule of a regular task. The first occurrence slot of a new task is its
        `planned_start`–`planned_end`; times are repeated by the wall clock of the
        user's time zone, also across daylight saving changes. Error codes:
        `no_occurrences` (the rule has no occurrence from the start on).
      properties:
        rrule:
          type: string
          maxLength: 200
          example: FREQ=WEEKLY;BYDAY=MO,WE
          description: |
            RRULE (RFC 5545) without DTSTART. Supported: FREQ=DAILY|WEEKLY|MONTHLY|YEARLY,
            INTERVAL, BYDAY (weekdays for WEEKLY; one ordinal weekday like `2TU` or `-1FR`
            for MONTHLY), BYMONTHDAY (MONTHLY), and COUNT or UNTIL (UTC, `20261231T205959Z`).
    Series:
      type: object
      required: [id, title, description, rrule, start_local, timezone, duration_minutes, category_ids]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        rrule:
          type: string
        start_local:
          type: string
          example: "2026-10-14T09:00"
          description: Wall-clock start of the first occurrence slot, read in `timezone`
        timezone:
          type: string
        duration_minutes:
          type: integer
        category_ids:
          type: array
          items:
            type: string
            format: uuid
    CategoryMinutes:
      type: object
      required: [category_id, minutes]
      properties:
        category_id:
          type: string
          format: uuid
        minutes:
          type: integer
    TaskMinutes:
      type: object
      required: [title, count, minutes]
      properties:
        title:
          type: string
        count:
          type: integer
        minutes:
          type: integer
    StatsDay:
      type: object
      required: [date, minutes, by_category]
      properties:
        date:
          type: string
          example: "2026-10-14"
          description: Local date
        minutes:
          type: integer
          description: Busy time of the day; parallel tasks are not counted twice
        by_category:
          type: array
          description: |
            The tasks of the day split by the color category of each task (its first category
            by name); `category_id` is null for tasks without a category. Parallel tasks add up.
          items:
            $ref: "#/components/schemas/DayCategoryMinutes"
    DayCategoryMinutes:
      type: object
      required: [category_id, minutes]
      properties:
        category_id:
          type: string
          format: uuid
          nullable: true
        minutes:
          type: integer
    PlanVsFact:
      type: object
      required:
        - planned_count
        - done
        - partial
        - not_done
        - in_progress
        - unmarked
        - upcoming
        - rescheduled
        - late_starts
        - overran
        - percent_done
      properties:
        planned_count:
          type: integer
          description: Planned tasks of the period by planned start, without rescheduled originals
        done:
          type: integer
        partial:
          type: integer
        not_done:
          type: integer
        in_progress:
          type: integer
        unmarked:
          type: integer
          description: Planned tasks whose time is over and nobody marked them; not in the fact
        upcoming:
          type: integer
        rescheduled:
          type: integer
          description: Rescheduled originals; their replacements are counted as planned
        late_starts:
          type: integer
          description: Tasks with the deviation `started_late`
        overran:
          type: integer
          description: Tasks with the deviation `finished_late`
        percent_done:
          type: integer
          nullable: true
          description: done / (done + partial + not done + unmarked), rounded; null until a task is decided
    StatsReport:
      type: object
      required:
        - from
        - to
        - actual_minutes
        - planned_minutes
        - unplanned_minutes
        - unplanned_count
        - long_running_timers
        - uncategorized_minutes
        - categories
        - tasks
        - days
        - plan_vs_fact
        - deviations
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        actual_minutes:
          type: integer
          description: Busy time by the fact, a union of intervals (FR-8.3)
        planned_minutes:
          type: integer
          description: Busy time by the plan, a union of intervals; rescheduled originals are not in it
        unplanned_minutes:
          type: integer
          description: The part of the fact that belongs to tasks outside the plan (FR-8.6)
        unplanned_count:
          type: integer
        long_running_timers:
          type: integer
          description: Timers that run for longer than 12 hours and are counted only for the first 12
        uncategorized_minutes:
          type: integer
        categories:
          type: array
          description: |
            Hours of each category including all its subcategories. A task counts once in each
            category of its categories and their ancestors (FR-8.2). Only categories with time.
          items:
            $ref: "#/components/schemas/CategoryMinutes"
        tasks:
          type: array
          description: Tasks grouped by title, the longest first
          items:
            $ref: "#/components/schemas/TaskMinutes"
        days:
          type: array
          items:
            $ref: "#/components/schemas/StatsDay"
        plan_vs_fact:
          $ref: "#/components/schemas/PlanVsFact"
        deviations:
          type: array
          description: |
            Tasks with a deviation, and not done, partial or rescheduled tasks with a comment,
            ordered by planned start (FR-8.4)
          items:
            $ref: "#/components/schemas/Instance"
