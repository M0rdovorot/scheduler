openapi: 3.0.3
info:
  title: Scheduler API
  version: 0.1.0
  description: Task planner API. Source of truth for the Go server and the TS client.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: system
  - name: auth
  - name: me
  - name: categories
  - name: tasks
  - name: tracking
  - name: stats
  - name: habits
  - name: reminders
  - name: partners
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database readiness probe
      tags: [system]
      security: []
      responses:
        "200":
          description: Service is up and the database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/telegram:
    post:
      operationId: loginTelegram
      summary: Sign in with Telegram Mini App init data
      description: |
        Verifies the signature and freshness of `init_data`. The account is
        created on the first sign-in; `timezone` is used only then.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionIssued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/dev:
    post:
      operationId: loginDev
      summary: Sign in without Telegram (development only)
      description: |
        Available only when the server runs with `APP_ENV=dev` and
        `DEV_AUTH=true`; otherwise responds 404. Each `key` is a separate user.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionIssued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/config:
    get:
      operationId: getAuthConfig
      summary: How a browser can sign in
      tags: [auth]
      security: []
      responses:
        "200":
          description: Sign-in options for the web version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /auth/telegram-widget:
    post:
      operationId: loginTelegramWidget
      summary: Sign in on the web with the Telegram Login Widget
      description: |
        Verifies the signature and freshness of the data the widget returned.
        This is the same account as in the Mini App. The session goes to an
        httpOnly cookie, not to the response body. The account is created on
        the first sign-in; `timezone` is used only then.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramWidgetLoginRequest"
      responses:
        "200":
          description: Signed in; the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: Deletes the session and clears the session cookie.
      tags: [auth]
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      operationId: getMe
      summary: Current user with settings
      tags: [me]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/settings:
    patch:
      operationId: updateMySettings
      summary: Change settings; omitted fields stay as they are
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories:
    get:
      operationId: listCategories
      summary: All categories of the user, archived ones included
      description: A flat list; build the tree from `parent_id`.
      tags: [categories]
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      summary: Create a category
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    patch:
      operationId: updateCategory
      summary: Rename or recolor a category; omitted fields stay as they are
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCategory
      summary: Delete a category together with all its subcategories
      description: |
        The deleted categories are removed from all tasks. Tasks themselves are kept.
      tags: [categories]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories/{id}/move:
    post:
      operationId: moveCategory
      summary: Move a category to another parent or to the top level
      description: |
        Error codes: `category_cycle` (the new parent is the category itself or
        one of its descendants), `parent_archived`.
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveCategoryRequest"
      responses:
        "200":
          description: Moved category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories/{id}/archive:
    post:
      operationId: archiveCategory
      summary: Archive a category together with all its subcategories
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Archived category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories/{id}/unarchive:
    post:
      operationId: unarchiveCategory
      summary: Restore one archived category
      description: |
        Its subcategories stay archived. Fails with `parent_archived` while
        the parent is archived.
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Restored category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances:
    get:
      operationId: listInstances
      summary: Tasks planned within a time window
      description: |
        Returns the tasks whose plan overlaps `[from, to)`, ordered by start.
        A task that crosses the window edge is returned whole. The window is at
        most 100 days.
      tags: [tasks]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tasks:
    post:
      operationId: createTask
      summary: Create a one-off task
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /instances/{id}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    patch:
      operationId: updateInstance
      summary: Edit a task; omitted fields stay as they are
      description: |
        With `scope=this` (the default) the task is changed on its own and answers with it;
        an occurrence of a regular task then becomes independent of later edits of the series.

        With `scope=following` or `all` the series is rewritten and the answer is 204:
        occurrences that are still planned and untouched are re-created from the new
        template when their window is next requested, so their ids change. Marked
        occurrences (with a fact or a status other than planned) are never changed.
        Only the time of day and the duration can change this way; a new date is
        refused with code `series_date_change`. `recurrence` changes the repeat rule.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/Scope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceRequest"
      responses:
        "200":
          description: Updated task (`scope=this`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "204":
          description: The series was rewritten (`scope=following` or `all`)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteInstance
      summary: Delete a task
      description: |
        Deleting one occurrence of a regular task keeps it as cancelled, so it is not
        created again. `following` and `all` delete the planned occurrences of the
        series; marked ones are history and stay as one-off tasks.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/Scope"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/running:
    get:
      operationId: listRunningInstances
      summary: Tasks whose timer is running, from whatever day they were started
      tags: [tracking]
      responses:
        "200":
          description: Running tasks, the longest running first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stats:
    get:
      operationId: getStats
      summary: Statistics of a period, by the fact
      description: |
        Hours by category and by task, the busy time, plan against fact, the breakdown by
        day and the deviations (FR-8). The period is at most 366 days; days are local days
        of the user's time zone.

        A running timer counts up to now, but at most 12 hours: a timer that runs longer
        counts only its first 12 hours and is reported in `long_running_timers`.
      tags: [stats]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /instances/unplanned:
    post:
      operationId: createUnplanned
      summary: Add a task outside the plan
      description: |
        With `actual_start` (and `actual_end`) the task is back-dated and done at once; with
        no `actual_end` a timer is running from `actual_start` (default: now).
      tags: [tracking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnplannedRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      operationId: completeInstance
      summary: "Done in one tap: the fact becomes equal to the plan"
      description: |
        Error code `invalid_state`: the task has no plan, or was rescheduled.
      tags: [tracking]
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{id}/start:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      operationId: startInstance
      summary: "Start a timer: the fact begins now"
      description: |
        Several tasks may run at once. Only a planned or not done task can be started (`invalid_state` otherwise).
      tags: [tracking]
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      operationId: stopInstance
      summary: "Stop the timer: the fact ends now and the task is done"
      description: |
        `invalid_state` when the task is not running.
      tags: [tracking]
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{id}/tracking:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    patch:
      operationId: updateTracking
      summary: Edit the status, the fact and the comment by hand
      description: |
        Omitted fields stay as they are. A status of `planned` removes the mark (the fact is
        cleared, the comment stays); `not_done` clears the fact too. With no status, a given
        fact decides it: a start alone is `in_progress`, a start and an end is `done`
        (a `partial` task stays partial). `done` or `partial` with no times take the plan.
        Rescheduled tasks cannot be changed (`invalid_state`).
      tags: [tracking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingPatch"
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{id}/reschedule:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      operationId: rescheduleInstance
      summary: Move a task to another time, leaving a trail
      description: |
        The original gets the status `rescheduled` and the reason and stays in the calendar;
        a new one-off task with the same title, description and categories is created at the
        new time and linked to it. Answers with the new task. Only a planned or not done task
        can be rescheduled (`invalid_state`).
      tags: [tracking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleRequest"
      responses:
        "201":
          description: The new task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /series/{id}:
    parameters:
      - $ref: "#/components/parameters/SeriesId"
    get:
      operationId: getSeries
      summary: The template of a regular task
      tags: [tasks]
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /habits:
    get:
      operationId: listHabits
      summary: All habits of the user, archived ones included
      tags: [habits]
      responses:
        "200":
          description: Habits, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createHabit
      summary: Create a habit
      description: |
        With `placement` the habit is also put in the grid: a regular task that starts today.
        Only for `daily` and `weekdays`.
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /habits/today:
    get:
      operationId: getHabitsToday
      summary: Habits for today, with today's marks
      description: |
        Habits planned for today's weekday, and those with a weekly goal (they can be worked on
        any day). Archived habits are left out. "Today" is the local date of the user.
      tags: [habits]
      responses:
        "200":
          description: Today's list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitsToday"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /habits/{id}:
    parameters:
      - $ref: "#/components/parameters/HabitId"
    get:
      operationId: getHabit
      summary: One habit
      tags: [habits]
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateHabit
      summary: Change a habit
      description: |
        The kind cannot be changed. When `frequency` is given, the schedule is replaced as a
        whole by `frequency`, `weekdays` and `times_per_week`. A new title or schedule reaches the
        habit's series in the grid.
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitPatch"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteHabit
      summary: Delete a habit with its marks
      description: |
        It leaves the grid. Occurrences that were marked stay in the calendar as ordinary tasks.
      tags: [habits]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /habits/{id}/archive:
    post:
      operationId: archiveHabit
      summary: Archive a habit
      description: Its marks stay. It leaves the grid; marked occurrences stay in the calendar.
      tags: [habits]
      parameters:
        - $ref: "#/components/parameters/HabitId"
      responses:
        "200":
          description: Archived habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /habits/{id}/unarchive:
    post:
      operationId: unarchiveHabit
      summary: Bring an archived habit back
      description: It does not go back to the grid by itself.
      tags: [habits]
      parameters:
        - $ref: "#/components/parameters/HabitId"
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /habits/{id}/placement:
    parameters:
      - $ref: "#/components/parameters/HabitId"
    put:
      operationId: setHabitPlacement
      summary: Put a habit in the grid, or change its time and length there
      description: |
        Only for `daily` and `weekdays`. The habit becomes a regular task that starts today;
        marked occurrences keep their time.
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitPlacement"
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: clearHabitPlacement
      summary: Take a habit out of the grid
      description: Planned occurrences go; marked ones stay as history.
      tags: [habits]
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /habits/{id}/logs/{date}:
    put:
      operationId: setHabitLog
      summary: Set the value of a habit on a local date
      description: |
        1 or 0 for a yes/no habit; the accumulated value for a quantity. Zero removes the mark.
        The value replaces the one that is there, including what a done occurrence in the grid
        credited. A day that has not come yet is refused.
      tags: [habits]
      parameters:
        - $ref: "#/components/parameters/HabitId"
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitLog"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /habits/{id}/stats:
    get:
      operationId: getHabitStats
      summary: Streaks, percentages and the heat map of a habit
      description: |
        Rules are in `docs/requirements.md` (assumption 8). `days` covers `from`..`to`, both
        included, at most 366 days. Percentages and streaks do not depend on the range.
      tags: [habits]
      parameters:
        - $ref: "#/components/parameters/HabitId"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /reminders/global:
    get:
      operationId: getGlobalReminders
      summary: The master switch, the quiet hours and the default reminders
      tags: [reminders]
      responses:
        "200":
          description: Global settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalReminders"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: setGlobalReminders
      summary: Replace the global reminder settings
      description: |
        With `enabled` false the bot writes nothing at all, whatever the other levels say.
        Quiet hours are local to the user and may wrap midnight; messages that fall into them
        are sent when they end.
      tags: [reminders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlobalReminders"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalReminders"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /reminders/{scope}/{id}:
    parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
          enum: [category, series, instance, habit]
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getReminders
      summary: Reminder settings of a category, a series, one occurrence or a habit
      description: |
        `override` is the level's own settings, or null when it inherits. `effective` says
        which level's rules apply now (the first with settings of its own: occurrence, series,
        categories, global; a habit has no inheritance) and what they are.
      tags: [reminders]
      responses:
        "200":
          description: The level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderLevel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setReminders
      summary: Give a level reminder settings of its own
      description: |
        Replaces what the level had. `enabled` false means no reminders on this level. A habit
        takes only `habit_time` rules, the others only the four task kinds.
      tags: [reminders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderOverride"
      responses:
        "200":
          description: The level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderLevel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteReminders
      summary: Take the level's own settings away, so that it inherits again
      tags: [reminders]
      responses:
        "200":
          description: The level, now inheriting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderLevel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /partners:
    get:
      operationId: listPartners
      summary: Partners of the user
      tags: [partners]
      responses:
        "200":
          description: Partners, with the access the user has given to each
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /partners/invites:
    post:
      operationId: createPartnerInvite
      summary: Create an invite link
      description: |
        The invite works once and for seven days. The token is returned only here; the client
        builds the link from it.
      tags: [partners]
      responses:
        "201":
          description: The invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /partners/invites/accept:
    post:
      operationId: acceptPartnerInvite
      summary: Accept an invite
      description: |
        Links the user with whoever made the invite; both then see each other's busy time.
        An unknown, expired or used token gives `404 invite_invalid`. The invite is not used up
        by a failed accept.
      tags: [partners]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptPartnerInviteRequest"
      responses:
        "200":
          description: The new partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `own_invite` (the user made this invite) or `already_partners`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /partners/{id}:
    parameters:
      - $ref: "#/components/parameters/PartnerId"
    delete:
      operationId: removePartner
      summary: Break the link
      description: The access given in either direction goes with it.
      tags: [partners]
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /partners/{id}/access:
    parameters:
      - $ref: "#/components/parameters/PartnerId"
    put:
      operationId: setPartnerAccess
      summary: Give or take back access for a partner
      description: Only the given fields change. Access to habits is separate from access to tasks.
      tags: [partners]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerAccess"
      responses:
        "200":
          description: The partner after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    PartnerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeriesId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      required: false
      description: |
        What an edit or a delete of an occurrence of a regular task applies to:
        only this one, this and the following ones, or all of them. A one-off
        task accepts only `this`.
      schema:
        type: string
        enum: [this, following, all]
        default: this
    InstanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HabitId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from `/auth/telegram` (the Mini App).
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        Session cookie from `/auth/telegram-widget` (the web version).
        Requests that change data must come from the same origin.
  responses:
    SessionIssued:
      description: Session token and the signed-in user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: validation_failed
        message:
          type: string
        field:
          type: string
          description: Name of the invalid request field, if any
    TelegramLoginRequest:
      type: object
      required: [init_data, timezone]
      properties:
        init_data:
          type: string
          description: Raw `Telegram.WebApp.initData`
        timezone:
          type: string
          description: IANA time zone of the device
          example: Europe/Moscow
    TelegramWidgetLoginRequest:
      type: object
      required: [auth_data, timezone]
      properties:
        auth_data:
          type: object
          description: |
            Every field the widget returned (`id`, `first_name`, `auth_date`,
            `hash`, …), as strings and unchanged: the signature covers them all.
          additionalProperties:
            type: string
        timezone:
          type: string
          description: IANA time zone of the device
          example: Europe/Moscow
    AuthConfig:
      type: object
      required: [telegram_bot_id]
      properties:
        telegram_bot_id:
          type: integer
          format: int64
          description: Bot for `Telegram.Login.auth`; 0 when Telegram sign-in is unavailable
    WebSession:
      type: object
      required: [expires_at, user]
      properties:
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    DevLoginRequest:
      type: object
      required: [timezone]
      properties:
        key:
          type: string
          maxLength: 64
          description: Identifies the dev user; defaults to `dev`
        display_name:
          type: string
        timezone:
          type: string
          example: Europe/Moscow
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: "Bearer token; send it as `Authorization: Bearer <token>`"
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    ViewMode:
      type: string
      enum: [day, three_days, week]
    SlotMinutes:
      type: integer
      enum: [5, 10, 15, 30, 60]
      x-enum-varnames: [Slot5, Slot10, Slot15, Slot30, Slot60]
    User:
      type: object
      required: [id, display_name, timezone, slot_minutes, default_view, deviation_threshold_minutes, default_visibility]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        timezone:
          type: string
          description: IANA time zone
        slot_minutes:
          $ref: "#/components/schemas/SlotMinutes"
        default_view:
          $ref: "#/components/schemas/ViewMode"
        deviation_threshold_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        default_visibility:
          $ref: "#/components/schemas/Visibility"
    SettingsPatch:
      type: object
      properties:
        timezone:
          type: string
        slot_minutes:
          $ref: "#/components/schemas/SlotMinutes"
        default_view:
          $ref: "#/components/schemas/ViewMode"
        deviation_threshold_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        default_visibility:
          $ref: "#/components/schemas/Visibility"
    Visibility:
      type: string
      enum: [partners, granted, private]
      description: |
        Who sees the title of a task: `partners` all partners, `granted` the partners who were
        given access to tasks, `private` nobody. The others see only that the time is busy.
    Category:
      type: object
      required: [id, parent_id, name, color, archived_at]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Null for top-level categories
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          example: "#3b82f6"
        archived_at:
          type: string
          format: date-time
          nullable: true
    CreateCategoryRequest:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          description: Hex color `#rrggbb`
          example: "#3b82f6"
        parent_id:
          type: string
          format: uuid
          description: Omit for a top-level category
    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          description: Hex color `#rrggbb`
    MoveCategoryRequest:
      type: object
      properties:
        parent_id:
          type: string
          format: uuid
          description: New parent; omit to move the category to the top level
    InstanceStatus:
      type: string
      enum: [planned, in_progress, done, partial, not_done, rescheduled, cancelled]
    DeviationKind:
      type: string
      enum: [started_late, started_early, finished_late, finished_early, took_longer, took_shorter]
    Deviation:
      type: object
      required: [kind, minutes]
      description: A difference between plan and fact that reaches the user's threshold.
      properties:
        kind:
          $ref: "#/components/schemas/DeviationKind"
        minutes:
          type: integer
          minimum: 1
    InstanceLink:
      type: object
      required: [id, planned_start, planned_end]
      description: The other half of a reschedule.
      properties:
        id:
          type: string
          format: uuid
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
    Instance:
      type: object
      required:
        - id
        - title
        - description
        - planned_start
        - planned_end
        - actual_start
        - actual_end
        - status
        - comment
        - category_ids
        - series_id
        - habit_id
        - visibility
        - rescheduled_from
        - rescheduled_to
        - deviations
      properties:
        id:
          type: string
          format: uuid
        series_id:
          type: string
          format: uuid
          nullable: true
          description: Set for occurrences of a regular task; see `GET /series/{id}`
        habit_id:
          type: string
          format: uuid
          nullable: true
          description: Set for occurrences of a habit that is placed in the grid
        title:
          type: string
        description:
          type: string
        planned_start:
          type: string
          format: date-time
          nullable: true
          description: Null for a task outside the plan
        planned_end:
          type: string
          format: date-time
          nullable: true
        actual_start:
          type: string
          format: date-time
          nullable: true
          description: Null until the task is started or marked
        actual_end:
          type: string
          format: date-time
          nullable: true
          description: Null while a timer is running
        status:
          $ref: "#/components/schemas/InstanceStatus"
        comment:
          type: string
        category_ids:
          type: array
          items:
            type: string
            format: uuid
        rescheduled_from:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InstanceLink"
        rescheduled_to:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InstanceLink"
        deviations:
          type: array
          description: Computed from the plan, the fact and the user's threshold; never stored
          items:
            $ref: "#/components/schemas/Deviation"
        visibility:
          allOf:
            - $ref: "#/components/schemas/Visibility"
          description: The task's own value, or the series' when the task has none
    TrackingPatch:
      type: object
      properties:
        status:
          type: string
          enum: [planned, in_progress, done, partial, not_done]
        actual_start:
          type: string
          format: date-time
        actual_end:
          type: string
          format: date-time
        comment:
          type: string
          maxLength: 2000
    RescheduleRequest:
      type: object
      required: [planned_start, planned_end]
      properties:
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
        comment:
          type: string
          maxLength: 2000
          description: The reason, shown on the original
    UnplannedRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        category_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        actual_start:
          type: string
          format: date-time
          description: Defaults to now
        actual_end:
          type: string
          format: date-time
          description: Omit to start a timer
    CreateTaskRequest:
      type: object
      required: [title, planned_start, planned_end]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
          description: Must be after `planned_start`; may be on a later day
        category_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        visibility:
          allOf:
            - $ref: "#/components/schemas/Visibility"
          description: Defaults to `default_visibility` of the user
    UpdateInstanceRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          description: An empty string clears the description
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
        category_ids:
          type: array
          maxItems: 50
          description: Replaces the whole set; an empty array removes all categories
          items:
            type: string
            format: uuid
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        visibility:
          allOf:
            - $ref: "#/components/schemas/Visibility"
          description: |
            With scope `this` the task's own value; with `following` and `all` the value of the
            series, which also takes the values of their own off the occurrences concerned and
            does not re-create them. As any edit of one occurrence, a value of its own sets
            the occurrence apart from the series (`is_detached`).
    Recurrence:
      type: object
      required: [rrule]
      description: |
        Repeat rule of a regular task. The first occurrence slot of a new task is its
        `planned_start`–`planned_end`; times are repeated by the wall clock of the
        user's time zone, also across daylight saving changes. Error codes:
        `no_occurrences` (the rule has no occurrence from the start on).
      properties:
        rrule:
          type: string
          maxLength: 200
          example: FREQ=WEEKLY;BYDAY=MO,WE
          description: |
            RRULE (RFC 5545) without DTSTART. Supported: FREQ=DAILY|WEEKLY|MONTHLY|YEARLY,
            INTERVAL, BYDAY (weekdays for WEEKLY; one ordinal weekday like `2TU` or `-1FR`
            for MONTHLY), BYMONTHDAY (MONTHLY), and COUNT or UNTIL (UTC, `20261231T205959Z`).
    Series:
      type: object
      required: [id, title, description, rrule, start_local, timezone, duration_minutes, category_ids]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        rrule:
          type: string
        start_local:
          type: string
          example: "2026-10-14T09:00"
          description: Wall-clock start of the first occurrence slot, read in `timezone`
        timezone:
          type: string
        duration_minutes:
          type: integer
        category_ids:
          type: array
          items:
            type: string
            format: uuid
    CategoryMinutes:
      type: object
      required: [category_id, minutes]
      properties:
        category_id:
          type: string
          format: uuid
        minutes:
          type: integer
    TaskMinutes:
      type: object
      required: [title, count, minutes]
      properties:
        title:
          type: string
        count:
          type: integer
        minutes:
          type: integer
    StatsDay:
      type: object
      required: [date, minutes, by_category]
      properties:
        date:
          type: string
          example: "2026-10-14"
          description: Local date
        minutes:
          type: integer
          description: Busy time of the day; parallel tasks are not counted twice
        by_category:
          type: array
          description: |
            The tasks of the day split by the color category of each task (its first category
            by name); `category_id` is null for tasks without a category. Parallel tasks add up.
          items:
            $ref: "#/components/schemas/DayCategoryMinutes"
    DayCategoryMinutes:
      type: object
      required: [category_id, minutes]
      properties:
        category_id:
          type: string
          format: uuid
          nullable: true
        minutes:
          type: integer
    PlanVsFact:
      type: object
      required:
        - planned_count
        - done
        - partial
        - not_done
        - in_progress
        - unmarked
        - upcoming
        - rescheduled
        - late_starts
        - overran
        - percent_done
      properties:
        planned_count:
          type: integer
          description: Planned tasks of the period by planned start, without rescheduled originals
        done:
          type: integer
        partial:
          type: integer
        not_done:
          type: integer
        in_progress:
          type: integer
        unmarked:
          type: integer
          description: Planned tasks whose time is over and nobody marked them; not in the fact
        upcoming:
          type: integer
        rescheduled:
          type: integer
          description: Rescheduled originals; their replacements are counted as planned
        late_starts:
          type: integer
          description: Tasks with the deviation `started_late`
        overran:
          type: integer
          description: Tasks with the deviation `finished_late`
        percent_done:
          type: integer
          nullable: true
          description: done / (done + partial + not done + unmarked), rounded; null until a task is decided
    StatsReport:
      type: object
      required:
        - from
        - to
        - actual_minutes
        - planned_minutes
        - unplanned_minutes
        - unplanned_count
        - long_running_timers
        - uncategorized_minutes
        - categories
        - tasks
        - days
        - plan_vs_fact
        - deviations
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        actual_minutes:
          type: integer
          description: Busy time by the fact, a union of intervals (FR-8.3)
        planned_minutes:
          type: integer
          description: Busy time by the plan, a union of intervals; rescheduled originals are not in it
        unplanned_minutes:
          type: integer
          description: The part of the fact that belongs to tasks outside the plan (FR-8.6)
        unplanned_count:
          type: integer
        long_running_timers:
          type: integer
          description: Timers that run for longer than 12 hours and are counted only for the first 12
        uncategorized_minutes:
          type: integer
        categories:
          type: array
          description: |
            Hours of each category including all its subcategories. A task counts once in each
            category of its categories and their ancestors (FR-8.2). Only categories with time.
          items:
            $ref: "#/components/schemas/CategoryMinutes"
        tasks:
          type: array
          description: Tasks grouped by title, the longest first
          items:
            $ref: "#/components/schemas/TaskMinutes"
        days:
          type: array
          items:
            $ref: "#/components/schemas/StatsDay"
        plan_vs_fact:
          $ref: "#/components/schemas/PlanVsFact"
        deviations:
          type: array
          description: |
            Tasks with a deviation, and not done, partial or rescheduled tasks with a comment,
            ordered by planned start (FR-8.4)
          items:
            $ref: "#/components/schemas/Instance"
    HabitPlacement:
      type: object
      required: [time, duration_minutes]
      properties:
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time of day
          example: "07:30"
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
    Habit:
      type: object
      required:
        - id
        - title
        - kind
        - target_value
        - unit
        - frequency
        - weekdays
        - times_per_week
        - color
        - archived_at
        - created_at
        - placement
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        kind:
          type: string
          enum: [boolean, quantity]
        target_value:
          type: integer
          description: The value that makes a day done; 1 for a yes/no habit
        unit:
          type: string
          description: Unit of a quantity ("стаканов", "мин"); empty for yes/no
        frequency:
          type: string
          enum: [daily, weekdays, times_per_week]
        weekdays:
          type: array
          description: ISO weekdays (1 = Monday … 7 = Sunday); empty unless `frequency` is `weekdays`
          items:
            type: integer
            minimum: 1
            maximum: 7
        times_per_week:
          type: integer
          nullable: true
          minimum: 1
          maximum: 7
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        placement:
          nullable: true
          description: Where the habit sits in the day grid; null when it is not in the grid
          allOf:
            - $ref: "#/components/schemas/HabitPlacement"
    HabitInput:
      type: object
      required: [title, kind, frequency, color]
      properties:
        title:
          type: string
        kind:
          type: string
          enum: [boolean, quantity]
        target_value:
          type: integer
          description: Required for a quantity; ignored for yes/no
        unit:
          type: string
        frequency:
          type: string
          enum: [daily, weekdays, times_per_week]
        weekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        times_per_week:
          type: integer
          minimum: 1
          maximum: 7
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
        placement:
          $ref: "#/components/schemas/HabitPlacement"
    HabitPatch:
      type: object
      properties:
        title:
          type: string
        target_value:
          type: integer
        unit:
          type: string
        frequency:
          type: string
          enum: [daily, weekdays, times_per_week]
        weekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        times_per_week:
          type: integer
          minimum: 1
          maximum: 7
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
    HabitLog:
      type: object
      required: [value]
      properties:
        value:
          type: integer
          minimum: 0
    HabitStreaks:
      type: object
      required: [current, best, unit]
      properties:
        current:
          type: integer
        best:
          type: integer
        unit:
          type: string
          enum: [day, week]
          description: Planned days in a row, or weeks in a row for a weekly goal
    HabitTodayItem:
      type: object
      required: [habit, value, done, week_done, streaks]
      properties:
        habit:
          $ref: "#/components/schemas/Habit"
        value:
          type: integer
          description: Today's value; 0 without a mark
        done:
          type: boolean
        week_done:
          type: integer
          description: Done days of the current week (Monday to Sunday)
        streaks:
          $ref: "#/components/schemas/HabitStreaks"
    HabitsToday:
      type: object
      required: [date, items]
      properties:
        date:
          type: string
          format: date
          description: Today's local date
        items:
          type: array
          items:
            $ref: "#/components/schemas/HabitTodayItem"
    HabitDay:
      type: object
      required: [date, value, done, planned]
      properties:
        date:
          type: string
          format: date
        value:
          type: integer
        done:
          type: boolean
        planned:
          type: boolean
          description: False on a day that is not in the schedule, and on every day of a weekly goal
    HabitStats:
      type: object
      required: [habit, today, streaks, percent_all, percent_30, percent_90, days]
      properties:
        habit:
          $ref: "#/components/schemas/Habit"
        today:
          type: string
          format: date
        streaks:
          $ref: "#/components/schemas/HabitStreaks"
        percent_all:
          type: integer
          nullable: true
          description: Share of done days (or weeks) over the whole history; null while nothing is over
        percent_30:
          type: integer
          nullable: true
        percent_90:
          type: integer
          nullable: true
        days:
          type: array
          items:
            $ref: "#/components/schemas/HabitDay"
    ReminderRule:
      type: object
      required: [kind, offset_minutes, time_of_day]
      properties:
        kind:
          type: string
          enum: [before_start, after_end, not_started, overrun, habit_time]
          description: |
            before_start: N minutes before the planned start. after_end: N minutes after the planned
            end, asking to mark the task. not_started: N minutes after the planned start if the task
            is neither started nor marked. overrun: N minutes after the planned end if the timer
            still runs. habit_time: a time of day, for a habit.
        offset_minutes:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10080
          description: For the four task kinds; null for habit_time
        time_of_day:
          type: string
          nullable: true
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time, for habit_time; null for the others
    QuietHours:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "23:00"
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "08:00"
    GlobalReminders:
      type: object
      required: [enabled, quiet_hours, rules]
      properties:
        enabled:
          type: boolean
        quiet_hours:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/QuietHours"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ReminderRule"
    ReminderOverride:
      type: object
      required: [enabled, rules]
      properties:
        enabled:
          type: boolean
        rules:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ReminderRule"
    EffectiveReminders:
      type: object
      required: [source, rules]
      properties:
        source:
          type: string
          enum: [global, category, series, instance, habit]
          description: The level whose rules apply
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ReminderRule"
    ReminderLevel:
      type: object
      required: [override, effective]
      properties:
        override:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReminderOverride"
        effective:
          $ref: "#/components/schemas/EffectiveReminders"
    Partner:
      type: object
      required: [id, display_name, created_at, tasks_shared, habits_shared]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        tasks_shared:
          type: boolean
          description: The user lets this partner see the titles of their tasks
        habits_shared:
          type: boolean
          description: The user lets this partner see their habits
    PartnerInvite:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    AcceptPartnerInviteRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
    PartnerAccess:
      type: object
      properties:
        tasks:
          type: boolean
        habits:
          type: boolean
