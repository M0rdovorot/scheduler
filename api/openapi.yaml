openapi: 3.0.3
info:
  title: Scheduler API
  version: 0.1.0
  description: Task planner API. Source of truth for the Go server and the TS client.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: me
  - name: categories
  - name: tasks
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database readiness probe
      tags: [system]
      security: []
      responses:
        "200":
          description: Service is up and the database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/telegram:
    post:
      operationId: loginTelegram
      summary: Sign in with Telegram Mini App init data
      description: |
        Verifies the signature and freshness of `init_data`. The account is
        created on the first sign-in; `timezone` is used only then.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionIssued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/dev:
    post:
      operationId: loginDev
      summary: Sign in without Telegram (development only)
      description: |
        Available only when the server runs with `APP_ENV=dev` and
        `DEV_AUTH=true`; otherwise responds 404. Each `key` is a separate user.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionIssued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /me:
    get:
      operationId: getMe
      summary: Current user with settings
      tags: [me]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/settings:
    patch:
      operationId: updateMySettings
      summary: Change settings; omitted fields stay as they are
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories:
    get:
      operationId: listCategories
      summary: All categories of the user, archived ones included
      description: A flat list; build the tree from `parent_id`.
      tags: [categories]
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      summary: Create a category
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    patch:
      operationId: updateCategory
      summary: Rename or recolor a category; omitted fields stay as they are
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCategory
      summary: Delete a category together with all its subcategories
      description: |
        The deleted categories are removed from all tasks. Tasks themselves are kept.
      tags: [categories]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories/{id}/move:
    post:
      operationId: moveCategory
      summary: Move a category to another parent or to the top level
      description: |
        Error codes: `category_cycle` (the new parent is the category itself or
        one of its descendants), `parent_archived`.
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveCategoryRequest"
      responses:
        "200":
          description: Moved category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories/{id}/archive:
    post:
      operationId: archiveCategory
      summary: Archive a category together with all its subcategories
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Archived category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories/{id}/unarchive:
    post:
      operationId: unarchiveCategory
      summary: Restore one archived category
      description: |
        Its subcategories stay archived. Fails with `parent_archived` while
        the parent is archived.
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Restored category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances:
    get:
      operationId: listInstances
      summary: Tasks planned within a time window
      description: |
        Returns the tasks whose plan overlaps `[from, to)`, ordered by start.
        A task that crosses the window edge is returned whole. The window is at
        most 100 days.
      tags: [tasks]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tasks:
    post:
      operationId: createTask
      summary: Create a one-off task
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /instances/{id}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    patch:
      operationId: updateInstance
      summary: Edit a task; omitted fields stay as they are
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteInstance
      summary: Delete a task
      tags: [tasks]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    InstanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from `/auth/telegram`.
  responses:
    SessionIssued:
      description: Session token and the signed-in user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: validation_failed
        message:
          type: string
        field:
          type: string
          description: Name of the invalid request field, if any
    TelegramLoginRequest:
      type: object
      required: [init_data, timezone]
      properties:
        init_data:
          type: string
          description: Raw `Telegram.WebApp.initData`
        timezone:
          type: string
          description: IANA time zone of the device
          example: Europe/Moscow
    DevLoginRequest:
      type: object
      required: [timezone]
      properties:
        key:
          type: string
          maxLength: 64
          description: Identifies the dev user; defaults to `dev`
        display_name:
          type: string
        timezone:
          type: string
          example: Europe/Moscow
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: "Bearer token; send it as `Authorization: Bearer <token>`"
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    ViewMode:
      type: string
      enum: [day, three_days, week]
    SlotMinutes:
      type: integer
      enum: [5, 10, 15, 30, 60]
      x-enum-varnames: [Slot5, Slot10, Slot15, Slot30, Slot60]
    User:
      type: object
      required: [id, display_name, timezone, slot_minutes, default_view, deviation_threshold_minutes]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        timezone:
          type: string
          description: IANA time zone
        slot_minutes:
          $ref: "#/components/schemas/SlotMinutes"
        default_view:
          $ref: "#/components/schemas/ViewMode"
        deviation_threshold_minutes:
          type: integer
          minimum: 0
          maximum: 1440
    SettingsPatch:
      type: object
      properties:
        timezone:
          type: string
        slot_minutes:
          $ref: "#/components/schemas/SlotMinutes"
        default_view:
          $ref: "#/components/schemas/ViewMode"
        deviation_threshold_minutes:
          type: integer
          minimum: 0
          maximum: 1440
    Category:
      type: object
      required: [id, parent_id, name, color, archived_at]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Null for top-level categories
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          example: "#3b82f6"
        archived_at:
          type: string
          format: date-time
          nullable: true
    CreateCategoryRequest:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          description: Hex color `#rrggbb`
          example: "#3b82f6"
        parent_id:
          type: string
          format: uuid
          description: Omit for a top-level category
    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          description: Hex color `#rrggbb`
    MoveCategoryRequest:
      type: object
      properties:
        parent_id:
          type: string
          format: uuid
          description: New parent; omit to move the category to the top level
    InstanceStatus:
      type: string
      enum: [planned, in_progress, done, partial, not_done, rescheduled, cancelled]
    Instance:
      type: object
      required: [id, title, description, planned_start, planned_end, status, category_ids]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/InstanceStatus"
        category_ids:
          type: array
          items:
            type: string
            format: uuid
    CreateTaskRequest:
      type: object
      required: [title, planned_start, planned_end]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
          description: Must be after `planned_start`; may be on a later day
        category_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    UpdateInstanceRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          description: An empty string clears the description
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
        category_ids:
          type: array
          maxItems: 50
          description: Replaces the whole set; an empty array removes all categories
          items:
            type: string
            format: uuid
