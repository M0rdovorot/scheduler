version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - misspell
    - unconvert
    - usestdlibvars
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/m0rdovorot/scheduler
